background {
    monitor =
    path = $HOME/.config/rofi/.current_wallpaper
    blur_passes = 3
    blur_size = 8
    noise = 0.015
    contrast = 0.95
    brightness = 0.75
}

input-field {
    monitor =
    size = 280, 52
    outline_thickness = 2
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    outer_color = rgb(d0bcff)
    inner_color = rgb(1d1926)
    font_color = rgb(f3eefc)
    fade_on_empty = false
    fade_timeout = 1000
    placeholder_text = <i><span foreground="##cac4d0">Enter Password...</span></i>
    hide_input = false
    rounding = 16
    check_color = rgb(a6e3a1)
    fail_color = rgb(f38ba8)
    fail_text = <i>Incorrect <b>($ATTEMPTS)</b></i>
    fail_transition = 150
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = rgb(e8def8)
    font_size = 84
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 140
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(208, 188, 255, 0.35)
}

label {
    monitor =
    text = cmd[update:1000] date +"%A, %d %B %Y"
    color = rgb(d0bcff)
    font_size = 18
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, 80
    halign = center
    valign = center
    shadow_passes = 2
}
