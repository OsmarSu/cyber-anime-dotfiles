# ==============================================================================
# yazi.toml — Cyber-Anime Configuration for Yazi 26.9+
# ==============================================================================

[mgr]
ratio          = [1, 3, 4]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_hidden    = false
show_symlink   = true

[preview]
tab_size        = 2
max_width       = 1920
max_height      = 1200
image_filter    = "lanczos3"
image_quality   = 90
sixel_fraction  = 12
ueberzug_scale  = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
edit = [
    { run = 'nvim "$@"', block = true, desc = "Neovim" },
    { run = 'code "$@"', orphan = true, desc = "VS Code" },
]
open = [
    { run = 'xdg-open "$@"', desc = "Abrir con aplicación por defecto" },
]
reveal = [
    { run = 'thunar "$(dirname "$1")"', orphan = true, desc = "Mostrar en Thunar" },
]
image = [
    { run = 'swappy -f "$1"', orphan = true, desc = "Swappy" },
    { run = 'xdg-open "$1"', orphan = true, desc = "Visor por defecto" },
]
video = [
    { run = 'mpv "$@"', orphan = true, desc = "MPV" },
]
audio = [
    { run = 'mpv --no-video "$@"', orphan = true, desc = "MPV Audio" },
]
archive = [
    { run = '7z x "$1" -o*', desc = "Extraer en carpeta" },
]

[open]
rules = [
    { url = "*/", use = [ "edit", "open", "reveal" ] },
    { mime = "text/*", use = [ "edit", "reveal" ] },
    { mime = "image/*", use = [ "image", "reveal" ] },
    { mime = "video/*", use = [ "video", "reveal" ] },
    { mime = "audio/*", use = [ "audio", "reveal" ] },
    { mime = "application/json", use = [ "edit", "reveal" ] },
    { mime = "application/pdf", use = [ "open", "reveal" ] },
    { mime = "application/zip", use = [ "archive", "reveal" ] },
    { mime = "application/x-tar", use = [ "archive", "reveal" ] },
    { mime = "application/x-7z-compressed", use = [ "archive", "reveal" ] },
    { mime = "*", use = [ "open", "reveal" ] },
]
