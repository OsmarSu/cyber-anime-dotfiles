# Theme: carlotta-ocean (Cyber-Anime RGB)

[mgr]
cwd = { fg = "#10b981", bold = true }

# Hovered item
hovered = { bg = "#0f2926", fg = "#10b981", bold = true }
preview_hovered = { underline = true }

# Find
find_keyword  = { fg = "#ffd166", bold = true, italic = true }
find_position = { fg = "#ffd166", bg = "reset", bold = true }

# Marker
marker_copied   = { fg = "#10b981", bg = "#10b981" }
marker_cut      = { fg = "#f43f5e", bg = "#f43f5e" }
marker_selected = { fg = "#10b981", bg = "#10b981" }

# Tab
tab_active   = { bg = "#10b981", fg = "#040f0e", bold = true }
tab_inactive = { bg = "#081a18", fg = "#a7f3d0" }
tab_width    = 1

# Count
count_copied   = { fg = "#040f0e", bg = "#10b981", bold = true }
count_cut      = { fg = "#040f0e", bg = "#f43f5e", bold = true }
count_selected = { fg = "#040f0e", bg = "#10b981", bold = true }

# Border
border_symbol = "│"
border_style  = { fg = "#084a36" }

[mode]
normal_main = { bg = "#10b981", fg = "#040f0e", bold = true }
normal_alt  = { bg = "#081a18", fg = "#10b981" }

select_main = { bg = "#06b6d4", fg = "#040f0e", bold = true }
select_alt  = { bg = "#081a18", fg = "#06b6d4" }

unset_main  = { bg = "#ffd166", fg = "#040f0e", bold = true }
unset_alt   = { bg = "#081a18", fg = "#ffd166" }

[status]
separator_open  = ""
separator_close = ""

# Progress
progress_label  = { fg = "#ecfdf5", bold = true }
progress_normal = { fg = "#10b981", bg = "#081a18" }
progress_error  = { fg = "#f43f5e", bg = "#081a18" }

# Permissions
permissions_t = { fg = "#10b981" }
permissions_r = { fg = "#ffd166" }
permissions_w = { fg = "#f43f5e" }
permissions_x = { fg = "#10b981" }
permissions_s = { fg = "#a7f3d0" }

[which]
cols            = 3
mask            = { bg = "#040f0e" }
cand            = { fg = "#10b981" }
rest            = { fg = "#a7f3d0" }
desc            = { fg = "#ecfdf5" }
separator       = " ➜ "
separator_style = { fg = "#084a36" }

[filetype]
rules = [
    # Directories
    { url = "*/", fg = "#10b981", bold = true },

    # Media with vibrant RGB
    { mime = "**/image/*", fg = "#06b6d4" },
    { mime = "**/{audio,video}/*", fg = "#818cf8" },

    # Archives
    { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f43f5e" },

    # Documents & Code
    { mime = "**/application/{pdf,doc,rtf}", fg = "#fb923c" },
    { mime = "application/json", fg = "#ffd166" },
    { mime = "text/markdown", fg = "#10b981" },

    # Special files
    { url = "*", is = "orphan", bg = "#f43f5e" },
    { url = "*", is = "exec", fg = "#10b981", bold = true },

    # Fallback
    { url = "*", fg = "#ecfdf5" },
]

[icon]
prepend_conds = [
    { if = "dir & hovered", text = "󰝰", fg = "#10b981" },
    { if = "dir", text = "󰉋", fg = "#10b981" },
    { if = "link", text = "", fg = "#06b6d4" },
    { if = "exec", text = "", fg = "#10b981" },
]
prepend_dirs = [
    # Spanish Common Folders
    { name = "Descargas", text = "󰉍", fg = "#06b6d4" },
